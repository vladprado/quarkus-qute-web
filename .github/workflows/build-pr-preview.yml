name: Build PR Preview

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.txt'
      - '.all-contributorsrc'
jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17ß
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Build Qute-Web
        run: mvn -B clean install --file pom.xml -DskipTests -Dno-format

      - name: Store PR id
        run: |
          echo ${{ github.event.number }} > ./docs/target/generated-docs/pr-id.txt

      - name: Publishing docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./docs/target/generated-docs
          retention-days: 3
      
      - name: Build Qute-Web
        uses: ./
        with:
          setup-java: 'false'
          github-pages: 'false'
          site-directory: 'qute'
          site-future: 'true'
          maven-executable: 'mvn'

      - name: Publishing templates
        uses: actions/upload-artifact@v4
        with:
          name: qute
          path: ./docs/modules/ROOT
          retention-days: 3

